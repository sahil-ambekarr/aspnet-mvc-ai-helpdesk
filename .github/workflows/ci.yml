name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Tests and CI never call a real model: no Ollama, no API key, no GPU.
      LLM_PROVIDER: mock
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4

      # The app targets net8.0. The 9.0 SDK (pinned in global.json) builds it;
      # the 8.0 install provides the runtime the tests execute on.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
